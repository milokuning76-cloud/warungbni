<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Sembako BNI Agen46</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-16 md:pb-0">

  <!-- Header / Navbar -->
  <header class="bg-blue-700 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
    <h1 class="text-base md:text-lg font-bold">Sembako BNI Agen46</h1>
    <input type="text" placeholder="Cari sembako..." class="px-3 py-1 rounded text-black text-sm w-1/2 md:w-1/3">
  </header>

  <!-- Main Content -->
  <main class="p-4 max-w-6xl mx-auto">
    <h2 class="text-lg font-bold mb-3">Katalog Bahan Pokok</h2>
    
    <!-- Grid Responsif: 2 Kolom di HP, 4 Kolom di Desktop -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-white p-3 rounded-lg shadow text-center border">
        <div class="w-full h-24 bg-gray-200 rounded mb-2 flex items-center justify-center text-gray-400 text-xs">Foto Produk</div>
        <h3 class="font-semibold text-sm">Beras Premium 5kg</h3>
        <p class="text-blue-600 font-bold text-sm my-1">Rp 68.000</p>
        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs py-2 rounded font-medium transition">
          + Keranjang
        </button>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation (Khusus Tampilan Mobile) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 text-xs text-gray-600 z-50">
    <a href="#" class="text-blue-600 font-semibold flex flex-col items-center">Beranda</a>
    <a href="#" class="flex flex-col items-center">Kategori</a>
    <a href="#" class="flex flex-col items-center">Keranjang</a>
    <a href="#" class="flex flex-col items-center">Kasir/POS</a>
  </nav>

</body>
</html>
